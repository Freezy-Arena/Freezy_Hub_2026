<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket settings page</title>
  <desc id="desc">Arena credentials and outbound message controls.</desc>
  <rect width="960" height="500" fill="#0f1117"/>
  <rect x="250" y="28" width="460" height="444" rx="14" fill="#1a1d27" stroke="#2d3148"/>
  <text x="286" y="69" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="21" font-weight="700">WebSocket Message Controls</text>
  <text x="286" y="94" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Arena login and outbound PLC messages.</text>
  <text x="286" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">Arena username</text>
  <rect x="286" y="141" width="388" height="42" rx="8" fill="#12151f" stroke="#2d3148"/>
  <text x="304" y="167" fill="#e2e8f0" font-family="monospace" font-size="14">admin</text>
  <text x="286" y="212" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">Arena password</text>
  <rect x="286" y="221" width="388" height="42" rx="8" fill="#12151f" stroke="#2d3148"/>
  <text x="304" y="247" fill="#e2e8f0" font-family="monospace" font-size="14">••••••••</text>
  <rect x="286" y="287" width="388" height="58" rx="8" fill="#12151f" stroke="#2d3148"/>
  <text x="304" y="312" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="14">Send Registers</text>
  <text x="304" y="332" fill="#64748b" font-family="Arial,sans-serif" font-size="12">Allow setRegisters counter updates</text>
  <rect x="614" y="304" width="44" height="24" rx="12" fill="#6366f1"/><circle cx="646" cy="316" r="9" fill="white"/>
  <rect x="286" y="359" width="388" height="58" rx="8" fill="#12151f" stroke="#2d3148"/>
  <text x="304" y="384" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="14">Send Inputs</text>
  <text x="304" y="404" fill="#64748b" font-family="Arial,sans-serif" font-size="12">Allow setInput state updates</text>
  <rect x="614" y="376" width="44" height="24" rx="12" fill="#6366f1"/><circle cx="646" cy="388" r="9" fill="white"/>
  <rect x="286" y="435" width="388" height="42" rx="8" fill="#6366f1"/>
  <text x="480" y="461" fill="white" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">Save WebSocket Settings</text>
  <path d="M250 202H145" stroke="#818cf8" stroke-width="2"/>
  <text x="24" y="196" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="14" font-weight="700">Saved to ESP32</text>
  <text x="24" y="216" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="14" font-weight="700">Preferences</text>
  <path d="M710 324H810" stroke="#818cf8" stroke-width="2"/>
  <text x="826" y="318" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="14" font-weight="700">Disable either</text>
  <text x="826" y="338" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="14" font-weight="700">message stream</text>
</svg>
